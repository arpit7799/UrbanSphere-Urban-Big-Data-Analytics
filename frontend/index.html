<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanSphere — A Big Data Analytics Platform for Urban Systems</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><circle cx='12' cy='12' r='10'/></svg>">
</head>
<body>
  <div class="app-container">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
        </div>
        <div class="brand-text">
          <h1>UrbanSphere</h1>
          <p>A Big Data Analytics Platform<br>for Urban Systems</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-view="overview">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Overview</span>
        </a>
        <a class="nav-item" data-view="traffic">
          <svg viewBox="0 0 24 24"><path d="M5 17h14M5 17a2 2 0 01-2-2V9a2 2 0 012-2h14a2 2 0 012 2v6a2 2 0 01-2 2M5 17l1.5 3h11L19 17M7 13h.01M17 13h.01"/></svg>
          <span>Traffic</span>
        </a>
        <a class="nav-item" data-view="air-quality">
          <svg viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <span>Air Quality</span>
        </a>
        <a class="nav-item" data-view="weather">
          <svg viewBox="0 0 24 24"><path d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
          <span>Weather</span>
        </a>
        <a class="nav-item" data-view="geography">
          <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          <span>Geographic View</span>
        </a>
        <a class="nav-item" data-view="analytics">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          <span>Analytics & ML</span>
        </a>
        <a class="nav-item" data-view="explorer">
          <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          <span>Data Explorer</span>
        </a>
        <a class="nav-item" data-view="reports">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>Reports</span>
        </a>
      </nav>

      <!-- Sidebar Bottom Gurugram Photo Card (Exact match to image.png) -->
      <div class="sidebar-footer-card" style="background-image: linear-gradient(to top, rgba(9, 14, 24, 0.92) 20%, rgba(9, 14, 24, 0.25) 100%), url('public/images/sidebar_gurugram.jpg');">
        <div class="sidebar-footer-content">
          <div class="sidebar-footer-title">Gurugram</div>
          <div class="sidebar-footer-sub">Smarter Insights for a Cleaner, Safer & Smarter City</div>
        </div>
      </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <!-- TOP NAVBAR (Exact match to image.png) -->
      <header class="top-navbar">
        <div class="nav-left">
          <!-- Locality Selector with Search Icon and Caret -->
          <div class="filter-dropdown">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px; stroke: var(--text-muted);"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <select id="global-locality-select">
              <option value="">All Localities</option>
            </select>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </div>

          <!-- Date Range Badge with dual calendars -->
          <div class="date-range-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Jan 01, 2022 &rarr; Dec 31, 2024</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left: 2px;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
        </div>

        <div class="nav-right">
          <!-- Live Backend Status with glowing green dot -->
          <div class="status-badge" id="backend-status-container">
            <span class="status-dot" id="backend-status-dot"></span>
            <span id="backend-status-text">Backend Connected</span>
          </div>

          <!-- Theme Pill Switch (Sun / Moon) -->
          <div id="theme-toggle-btn" style="background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-card); border-radius: 20px; padding: 4px 8px; display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <svg viewBox="0 0 24 24" width="13" height="13" stroke="#facc15" fill="none" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <div style="width: 22px; height: 12px; background: #2563eb; border-radius: 6px; position: relative;">
              <div style="width: 10px; height: 10px; background: #ffffff; border-radius: 50%; position: absolute; right: 1px; top: 1px;"></div>
            </div>
          </div>

          <!-- User Profile Badge (AP | Arpit Pandey) -->
          <div class="user-profile-badge">
            <div class="user-avatar">AP</div>
            <span style="color: #ffffff; font-weight: 500;">Arpit Pandey</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 12px; height: 12px; stroke: var(--text-dim);"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
      </header>

      <!-- DYNAMIC VIEW CONTENT CONTAINER -->
      <main class="dashboard-content" id="view-content-area">
        <!-- Rendered by Active View Class -->
      </main>
    </div>
  </div>

  <!-- App Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
